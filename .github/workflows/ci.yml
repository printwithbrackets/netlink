name: CI

on:
  push:
  pull_request:

jobs:
  c-core:
    name: C core (build + tests, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            make CRYPTO_CFLAGS="-I$(brew --prefix openssl)/include" CRYPTO_LIBS="-L$(brew --prefix openssl)/lib -lcrypto"
          else
            make
          fi

      - name: Run tests
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            make test CRYPTO_CFLAGS="-I$(brew --prefix openssl)/include" CRYPTO_LIBS="-L$(brew --prefix openssl)/lib -lcrypto"
          else
            make test
          fi

      - name: Build examples
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            make examples CRYPTO_CFLAGS="-I$(brew --prefix openssl)/include" CRYPTO_LIBS="-L$(brew --prefix openssl)/lib -lcrypto"
          else
            make examples
          fi

  python-bindings:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build native library
        run: make
      - name: Install pytest
        run: pip install pytest
      - name: Run Python binding tests
        run: |
          cd bindings/python
          NETLINK_LIBRARY_PATH=../../build/libnetlink.so pytest tests/ -v

  go-bindings:
    name: Go bindings (best-effort -- not yet verified upstream)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build native library
        run: make
      - name: Build Go bindings
        run: |
          cd bindings/go
          go build ./...
          go vet ./...

  rust-bindings:
    name: Rust bindings (best-effort -- not yet verified upstream)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build native library
        run: make
      - name: Build Rust bindings
        run: |
          cd bindings/rust
          cargo build
          cargo test
